<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Mate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header select {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        /* ---- Chat Area ---- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.agent {
            align-self: flex-start;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-bottom-left-radius: 4px;
        }
        .message.tool {
            align-self: flex-start;
            background: #1a2e1a;
            border: 1px solid #2d4a2d;
            font-size: 13px;
            color: #7ddf7d;
        }
        .message.error {
            align-self: flex-start;
            background: #2e1a1a;
            border: 1px solid #4a2d2d;
            color: #df7d7d;
        }

        /* ---- Input Area ---- */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }
        .input-area textarea {
            flex: 1;
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            height: 48px;
            max-height: 120px;
            font-family: inherit;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #2563eb;
        }
        .input-area button {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #1d4ed8; }
        .input-area button:disabled {
            background: #3a3a3a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Music Mate</h1>
        <select id="providerSelect">
            <option value="deepseek">DeepSeek</option>
            <option value="qwen">Qwen</option>
            <option value="minimax" selected>MiniMax</option>
            <option value="openAI">OpenAI</option>
        </select>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
        <textarea
            id="userInput"
            placeholder="Describe the song you want to create..."
            rows="1"
        ></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const providerSelect = document.getElementById('providerSelect');

        const sessionId = crypto.randomUUID();

        // Auto-resize textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = '48px';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        // Send on Enter (Shift+Enter for newline)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = '48px';
            sendBtn.disabled = true;

            const agentDiv = appendMessage('agent', '');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        provider: providerSelect.value,
                        message: text,
                    }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('event:')) {
                            var eventType = line.replace('event:', '').trim();
                        } else if (line.startsWith('data:')) {
                            var dataStr = line.replace('data:', '').trim();
                            try {
                                const data = JSON.parse(dataStr);

                                if (eventType === 'token' && data.token) {
                                    agentDiv.textContent += data.token;
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                } else if (eventType === 'tool_result') {
                                    appendMessage('tool', data.output);
                                } else if (eventType === 'error') {
                                    appendMessage('error', data.error);
                                }
                            } catch (e) {
                                // Skip malformed JSON
                            }
                        }
                    }
                }
            } catch (err) {
                appendMessage('error', `Connection error: ${err.message}`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
